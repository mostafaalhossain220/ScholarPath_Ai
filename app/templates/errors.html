{% extends "base.html" %}
{% block title %}{{ error_title|default("Notice") }} | ScholarPath AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-7 col-lg-5 text-center">
    <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 auth-box-sweet">
      <div class="feature-icon-box mx-auto mb-3 text-danger bg-danger-subtle rounded-circle d-inline-flex p-3">
        <i class="bi bi-shield-lock-fill fs-2"></i>
      </div>
      <h1 class="h4 fw-bold text-dark mb-2">{{ error_title|default("Notice") }}</h1>
      <p class="text-muted small mb-4">{{ error_message|default("The requested resource could not be found or processed.") }}</p>
      <a href="{{ url_for('index') }}" class="btn btn-sp-sweet px-4 py-2">
        <i class="bi bi-house-door me-1"></i> Return Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
