{% extends "base.html" %}
{% block title %}{{ error_title|default("Notice") }} | ScholarPath AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-4 py-md-5">
  <div class="col-md-7 col-lg-5 text-center">
    <div class="card auth-box-sweet p-4 p-md-5">
      <div class="empty-state p-0 mb-2"><i class="bi bi-flower1"></i></div>
      <h1 class="h4 fw-bold mb-2">{{ error_title|default("Notice") }}</h1>
      <p class="text-muted mb-4">{{ error_message|default("The requested resource could not be found or processed.") }}</p>
      <div class="d-flex gap-2 justify-content-center flex-wrap">
        <a href="{{ url_for('index') }}" class="btn btn-sp-sweet px-4 py-2">
          <i class="bi bi-house-door me-1"></i> Return home
        </a>
        <a href="{{ url_for('opportunities.list_opportunities') }}" class="btn btn-ghost px-4 py-2">
          <i class="bi bi-mortarboard me-1"></i> Opportunities
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
