{% extends "base.html" %}
{% block title %}Log in | ScholarPath AI{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Welcome back</h1>
        <p class="text-muted mb-4">Log in to continue your scholarship search.</p>

        {% if error %}
        <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" value="{{ email }}"
                   autocomplete="email" required autofocus>
          </div>

          <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password"
                   autocomplete="current-password" required>
          </div>

          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
      </div>
    </div>
    <p class="text-center mt-3 text-muted">
      New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
